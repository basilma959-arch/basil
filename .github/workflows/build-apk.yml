name: Build AL BASIL APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild AL BASIL interface
        run: |
          cat .source/index/part*.txt > app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="ui_patch.js"></script>',
              '<script src="ui_base_style.js"></script>',
              '<script src="camera_native_patch.js"></script>'
          ]
          for tag in tags:
              s=s.replace(tag,'')
          head,sep,tail=s.rpartition('</body>')
          if not sep:
              raise SystemExit('Missing final </body>')
          s=head+'\n'+'\n'.join(tags)+'\n'+sep+tail
          for tag in tags:
              if s.count(tag)!=1:
                  raise SystemExit('Bad script injection: '+tag)
          if s.index('function exportLastCount') > s.index(tags[0]):
              raise SystemExit('UI scripts injected inside application JavaScript')
          p.write_text(s,encoding='utf-8')
          PY
          test -s app/src/main/assets/index.html
          grep -q 'ui_patch.js' app/src/main/assets/index.html
          grep -q 'ui_base_style.js' app/src/main/assets/index.html
          grep -q 'camera_native_patch.js' app/src/main/assets/index.html
          node --check app/src/main/assets/ui_patch.js
          node --check app/src/main/assets/ui_base_style.js
          node --check app/src/main/assets/camera_native_patch.js

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AL_BASIL.apk

      - name: Upload AL BASIL APK
        uses: actions/upload-artifact@v4
        with:
          name: AL_BASIL_APK
          path: AL_BASIL.apk
          if-no-files-found: error
