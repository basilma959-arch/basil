name: Build AL BASIL BM Native APK

on:
  workflow_dispatch:
  push:
    branches: ["al-basil-bm-native"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch indexed XML import list
        run: python3 scripts/patch_xml_index_import.py

      - name: Patch SpreadsheetML import fallback
        run: python3 scripts/patch_spreadsheetml_import.py

      - name: Patch import preview and duplicates
        run: python3 scripts/patch_import_preview_duplicates.py

      - name: Patch manual inventory item
        run: python3 scripts/patch_manual_item.py

      - name: Fix manual item JSON loader
        run: python3 scripts/patch_manual_item_compile_fix.py

      - name: Patch embedded camera scanner flow
        run: python3 tools/patch_camera.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk AL_BASIL_BM_NATIVE.apk
          unzip -t AL_BASIL_BM_NATIVE.apk >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose AL_BASIL_BM_NATIVE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL_BASIL_BM_NATIVE_APK
          path: AL_BASIL_BM_NATIVE.apk
          if-no-files-found: error
