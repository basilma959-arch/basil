name: Build AL BASIL BM Native APK

on:
  workflow_dispatch:
  push:
    branches: ["al-basil-bm-native"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Android document picker for XML visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/albasil/inventory/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          start = s.index('    private void chooseXml() {')
          end = s.index('    private void confirmDeleteMaterials()', start)
          new_method = '''    private void chooseXml() {
              // Do not filter by MIME type here. Many Android file providers label XML
              // as text/plain or application/octet-stream and would otherwise hide it.
              // Showing all documents matches Al-Ameen's picker behavior; the app parses
              // and validates the selected file as XML after selection.
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
              i.addCategory(Intent.CATEGORY_OPENABLE);
              i.setType("*/*");
              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
              i.addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
              try {
                  startActivityForResult(i, REQ_IMPORT_XML);
              } catch (Exception e) {
                  Intent fallback = new Intent(Intent.ACTION_GET_CONTENT);
                  fallback.addCategory(Intent.CATEGORY_OPENABLE);
                  fallback.setType("*/*");
                  fallback.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivityForResult(Intent.createChooser(fallback, "اختر ملف XML"), REQ_IMPORT_XML);
              }
          }

'''
          p.write_text(s[:start] + new_method + s[end:], encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk AL_BASIL_BM_NATIVE.apk
          unzip -t AL_BASIL_BM_NATIVE.apk >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose AL_BASIL_BM_NATIVE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL_BASIL_BM_NATIVE_APK
          path: AL_BASIL_BM_NATIVE.apk
          if-no-files-found: error
