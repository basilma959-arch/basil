name: Build BM Native Rebuild

on:
  push:
    branches: [ bm-native-rebuild ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble native Java source
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/albasil/bm
          cat .source/native/part*.txt > app/src/main/java/com/albasil/bm/MainActivity.java
          test -s app/src/main/java/com/albasil/bm/MainActivity.java
          grep -q 'package com.albasil.bm;' app/src/main/java/com/albasil/bm/MainActivity.java
          grep -q 'approval_snapshot_' app/src/main/java/com/albasil/bm/MainActivity.java
          grep -q 'parseSpreadsheet' app/src/main/java/com/albasil/bm/MainActivity.java

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.albasil.bm'" apk-badging.txt
          grep -q "launchable-activity: name='com.albasil.bm.MainActivity'" apk-badging.txt
          cp "$APK" AL_BASIL_BM_NATIVE_REBUILD_TEST1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL_BASIL_BM_NATIVE_REBUILD_TEST1
          path: AL_BASIL_BM_NATIVE_REBUILD_TEST1.apk
          if-no-files-found: error
